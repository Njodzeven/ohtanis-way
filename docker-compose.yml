services:
  postgres:
    image: postgres:16-alpine
    container_name: ohtani_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ohtani}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ohtani_dev_password_CHANGE_IN_PRODUCTION}
      POSTGRES_DB: ${POSTGRES_DB:-ohtani_db}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ohtani_network

  mongo:
    image: mongo:7.0
    container_name: ohtani_mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-ohtani}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-ohtani_dev_password_CHANGE_IN_PRODUCTION}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - ohtani_network

volumes:
  postgres_data:
  mongo_data:


networks:
  ohtani_network:
    driver: bridge
